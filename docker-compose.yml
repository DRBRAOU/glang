# BRAOU Gondi Vaani - production stack for an Ubuntu server
#   docker compose up -d --build
# Data (database, audio, backups) lives in ./data on the host.

services:
  app:
    build: .
    image: braou/gondi-vaani:1.0
    container_name: gondi-vaani-app
    env_file: .env
    environment:
      GV_STORAGE_DIR: /data
      GV_DATABASE_URL: sqlite:////data/gondi_vaani.db
    volumes:
      - ./data:/data
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    container_name: gondi-vaani-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/gondi-vaani.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro
      - ./deployment/certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
