# Nginx reverse proxy for Gondi Vaani (used by the "nginx" service in docker-compose.yml)
# Certificates are read from /etc/nginx/certs/{fullchain,privkey}.pem
# (self-signed from scripts/make-selfsigned-cert.sh, or Let's Encrypt from scripts/letsencrypt.sh)

upstream gondi_vaani_app {
    server app:8000;
    keepalive 16;
}

# HTTP: only ACME challenges; everything else goes to HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 'listen ... http2' works on nginx 1.18-1.27 (newer versions also accept 'http2 on;')
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Bulk import ZIPs can be large; keep in step with GV_MAX_ZIP_BYTES
    client_max_body_size 320m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    # Static assets can be cached by browsers (fonts never change)
    location ~ ^/(css|js)/ {
        proxy_pass http://gondi_vaani_app;
        proxy_set_header Host $host;
        expires 1h;
    }
    location /fonts/ {
        proxy_pass http://gondi_vaani_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://gondi_vaani_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }
}
